[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localitylens"
version = "0.1.0"
description = "AST-aware observability tool for coding-agent workflows"
requires-python = ">=3.11"

dependencies = [
    "typer[all]",          # includes rich for terminal output
    "pydantic>=2.0",
    "pyvis",               # required by TransitionGraphVisualizer
    "rich",                # explicit pin — used throughout CLI even without typer[all]
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
localitylens = "localitylens.cli.main:app"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
